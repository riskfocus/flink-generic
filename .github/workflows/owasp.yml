name: OWASP Dependency-Check

# Scheduled CVE gate. Kept OUT of the main `mvn verify` CI so PR builds stay fast and never
# flake on NVD API outages. Runs weekly and on demand; fails on any dependency with a CVE
# scoring CVSS >= 7 (configured in the `owasp` Maven profile in pom.xml).
#
# Set an NVD_API_KEY repository secret (Settings > Secrets and variables > Actions) to avoid
# NVD API rate limiting. Request a free key at https://nvd.nist.gov/developers/request-an-api-key
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # schema-versioned key: bump when the dependency-check DB schema changes
          # (12.2.2 widened the URL column, schema 5.5 -> 5.6) so a stale-schema cache
          # from an older plugin isn't reused. See DependencyCheck PR #8467.
          key: nvd-data-schema5_6-${{ runner.os }}
          restore-keys: nvd-data-schema5_6-

      - name: Run OWASP dependency-check (fail on CVSS >= 7)
        run: mvn -B -Powasp dependency-check:aggregate -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/target/dependency-check-report.*'
          if-no-files-found: warn
